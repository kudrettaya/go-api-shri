name: Go CI

on push:
  branches: [ "main" ]
  paths: 
    - 'goapi/**'
    - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.27.1
    - name: Install dependencies
      run: go mod tidy
    - name: Run tests
      run: go test ./...    
